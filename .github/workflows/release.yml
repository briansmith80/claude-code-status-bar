name: Release

# Tag-driven release automation: push a v* tag and this workflow verifies
# the version sources agree, extracts the matching CHANGELOG section, and
# publishes the GitHub release. Retires the manual `gh release create` step
# (and the class of human error where VERSION/plugin.json/CHANGELOG drift).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version sources agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          plugin_version="$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' .claude-plugin/plugin.json | head -1 | grep -o '[0-9][0-9.]*')"
          echo "tag=$tag VERSION=$file_version plugin.json=$plugin_version"
          [ "$tag" = "$file_version" ]   || { echo "::error::VERSION file ($file_version) does not match tag ($tag)"; exit 1; }
          [ "$tag" = "$plugin_version" ] || { echo "::error::plugin.json version ($plugin_version) does not match tag ($tag)"; exit 1; }
          grep -Fq "## [$tag]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] section"; exit 1; }

      - name: Extract changelog section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v header="## [$tag]" '
            index($0, header) == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          test -s release-notes.md || { echo "::error::extracted changelog section is empty"; exit 1; }
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
